services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: fenco_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: fenco
      POSTGRES_PASSWORD: fenco_password
      POSTGRES_DB: fenco_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fenco -d fenco_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fenco_redis_prod
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fenco_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://fenco:fenco_password@postgres:5432/fenco_db
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-pending_key}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      CORS_ORIGIN: http://localhost:80
    ports:
      - '3001:3001'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fenco_frontend_prod
    restart: always
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  postgres_prod_data:
