services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: fenco_postgres
    environment:
      POSTGRES_USER: fenco
      POSTGRES_PASSWORD: fenco_password
      POSTGRES_DB: fenco_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fenco -d fenco_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fenco_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
